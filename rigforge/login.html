<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>RigForge | Giriş Yap</title>
    <link href="shared.css" rel="stylesheet" />
    <link href="auth.css" rel="stylesheet" />
    <link href="rigforge-shell.css" rel="stylesheet" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <section class="auth-visual">
        <a class="brand" href="index.html">RIGFORGE</a>
        <div>
          <span class="eyebrow">SİSTEMİNİ KAYDET</span>
          <h1>Topladığın bilgisayara her yerden ulaş.</h1>
          <p>Kaydettiğin sistemleri ve siparişlerini tek panelden yönet.</p>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <a class="back-home-link auth-back-link" href="index.html"
            >← Ana Sayfaya Dön</a
          >
          <h2>Giriş Yap</h2>
          <p class="muted">RigForge hesabına devam et.</p>
          <form id="loginForm">
            <div class="form-group">
              <label class="label" for="loginEmail">E-posta</label
              ><input
                class="input"
                id="loginEmail"
                placeholder="ornek@mail.com"
                required=""
                type="email"
              />
            </div>
            <div class="form-group">
              <label class="label" for="loginPassword">Şifre</label
              ><input
                class="input"
                id="loginPassword"
                placeholder="••••••••"
                required=""
                type="password"
              />
            </div>
            <div class="captcha-group">
              <label class="label" for="loginCaptchaInput">Güvenlik Kodu</label>
              <div class="captcha-row">
                <div
                  aria-label="Güvenlik kodu"
                  class="captcha-code"
                  id="loginCaptchaCode"
                ></div>
                <button
                  aria-label="Güvenlik kodunu yenile"
                  class="captcha-refresh"
                  id="refreshLoginCaptcha"
                  type="button"
                >
                  ↻ Yenile
                </button>
              </div>
              <input
                autocomplete="off"
                class="input"
                id="loginCaptchaInput"
                inputmode="text"
                placeholder="Yukarıdaki kodu yazın"
                required=""
              />
            </div>
            <div class="auth-options">
              <label
                ><input id="rememberMe" type="checkbox" /> Beni hatırla</label
              ><a href="#">Şifremi unuttum</a>
            </div>
            <button class="primary-btn full-btn" type="submit">
              Giriş Yap
            </button>
            <p class="form-status" id="loginStatus"></p>
          </form>
          <div class="divider"><span>veya</span></div>
          <button
            class="social-btn google-btn"
            id="googleContinueBtn"
            type="button"
          >
            Google ile devam et
          </button>
          <p class="switch-text">
            Hesabın yok mu? <a href="register.html">Kayıt ol</a>
          </p>
        </div>
      </section>
    </div>
    <script src="auth.js"></script>
    <script src="rigforge-shell.js"></script>
  </body>
</html>
