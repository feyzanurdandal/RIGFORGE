<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RigForge | Kargo Takibi</title>
    <link href="shared.css" rel="stylesheet" />
    <link href="rigforge-shell.css" rel="stylesheet" />
    <style>
      body {
        background: #080a10;
        color: #fff;
      }
      .legal-main {
        max-width: 1080px;
        margin: auto;
        padding: 52px 24px 100px;
      }
      .legal-main > .back-home-link {
        display: inline-flex;
        margin: 0 0 30px;
      }
      .legal-main > .eyebrow {
        display: block;
        margin-bottom: 12px;
        color: #8fbcff;
        letter-spacing: 0.7px;
      }
      .legal-main h1 {
        font-size: clamp(38px, 5vw, 58px);
        line-height: 1.08;
        margin: 0;
      }
      .legal-card {
        background: #11141d;
        border: 1px solid #303646;
        border-radius: 20px;
        padding: 34px;
        margin-top: 32px;
      }
      .legal-card h2 {
        margin: 32px 0 12px;
        color: #fff;
      }
      .legal-card p,
      .legal-card li {
        color: #c7cddb;
        line-height: 1.8;
        font-size: 17px;
      }
      .simple-footer {
        padding: 28px;
        text-align: center;
        border-top: 1px solid #252a36;
        color: #b9c0d0;
      }
    </style>
    <style>
      .track-form {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 12px;
      }
      .track-form input {
        padding: 14px;
        border: 1px solid #303649;
        border-radius: 11px;
        background: #0b0e15;
        color: #fff;
      }
      .track-form button {
        padding: 0 22px;
        border: 0;
        border-radius: 11px;
        background: linear-gradient(135deg, #347cff, #965cff);
        color: #fff;
        font-weight: 800;
      }
      .timeline {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 25px;
      }
      .step {
        padding: 16px;
        border: 1px solid #303649;
        border-radius: 12px;
        color: #8f97aa;
      }
      .step.done {
        border-color: #347cff;
        color: #fff;
        background: rgba(52, 124, 255, 0.12);
      }
      @media (max-width: 700px) {
        .track-form {
          grid-template-columns: 1fr;
        }
        .track-form button {
          padding: 14px;
        }
        .timeline {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body>
    <header class="site-header rigforge-header">
      <a class="brand rigforge-brand" href="index.html"
        ><span class="brand-mark">R</span><span>RIGFORGE</span></a
      >
      <nav class="main-nav">
        <a href="index.html">Sistemler</a
        ><a href="index.html#components">Bileşenler</a
        ><a href="builder.html">Sistem Topla</a
        ><a href="index.html#support">Destek</a>
      </nav>
      <div class="header-actions">
        <a class="nav-action cart-action" href="cart.html"
          ><span>Sepet</span
          ><span class="cart-count" id="headerCartCount">0</span></a
        ><a class="nav-action profile-action" href="profile.html"
          ><span class="profile-emoji">👤</span
          ><span class="action-label">Profil</span></a
        ><a class="build-now-button" href="builder.html">+ Sistem Topla</a>
      </div>
    </header>
    <main class="legal-main">
      <a class="back-home-link" href="index.html">← Ana Sayfaya Dön</a
      ><span class="eyebrow">SİPARİŞ DURUMU</span>
      <h1>Kargo Takibi</h1>
      <div class="legal-card">
        <form class="track-form" id="trackForm">
          <input
            id="orderNo"
            placeholder="Sipariş numarası (RF-10482)"
            required
          /><input
            id="trackEmail"
            type="email"
            placeholder="E-posta adresi"
            required
          /><button>Sorgula</button>
        </form>
        <div id="trackResult" hidden>
          <h2>Siparişiniz hazırlanıyor</h2>
          <p>Takip No: <strong>RFK-884210</strong> • Kargo: Yurtiçi Kargo</p>
          <div class="timeline">
            <div class="step done">Sipariş Alındı</div>
            <div class="step done">Hazırlanıyor</div>
            <div class="step">Kargoya Verildi</div>
            <div class="step">Teslim Edildi</div>
          </div>
        </div>
        <p id="trackError"></p>
      </div>
    </main>
    <footer class="simple-footer">© 2026 RigForge</footer>
    <script>
      trackForm.onsubmit = (e) => {
        e.preventDefault();
        if (orderNo.value.trim().toUpperCase() === "RF-10482") {
          trackResult.hidden = false;
          trackError.textContent = "";
        } else {
          trackResult.hidden = true;
          trackError.textContent =
            "Demo için RF-10482 sipariş numarasını kullanabilirsiniz.";
        }
      };
    </script>
    <script src="rigforge-shell.js"></script>
  </body>
</html>
